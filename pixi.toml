[workspace]
authors = ["Seedking"]
channels = ["conda-forge"]
name = "WatchThisAnime"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
serve = ".pixi/envs/default/python.exe -m src"
lint = ".pixi/envs/default/Scripts/ruff.exe check src/"
pytest = ".pixi/envs/default/python.exe -m pytest"
demo = ".pixi/envs/default/python.exe scripts/seed_demo.py"
inspect = "npx @modelcontextprotocol/inspector"
code = "code ."
clean-db = ".pixi/envs/default/python.exe -c \"import pathlib; pathlib.Path('watchthisanime.db').unlink(missing_ok=True)\""

[dependencies]
python = ">=3.14.5,<3.15"
mcp = ">=1.27.2,<2"
httpx = ">=0.28.1,<0.29"
sqlalchemy = ">=2.0"
nodejs = "*"
pytest = "*"
ruff = "*"
python-dotenv = ">=1.2.2,<2"
